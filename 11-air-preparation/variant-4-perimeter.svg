<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="760" height="560" fill="#fbfaf7"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">V4 — обёртка вокруг тёплого плениума (не рекомендован)</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#777">труба + нить петлёй вокруг камеры PM внутри корпуса · min длина выхода</text>

  <!-- enclosure -->
  <rect x="150" y="80" width="460" height="420" rx="14" fill="#f4f1ea" stroke="#b5ab98" stroke-width="2"/>
  <text x="170" y="106" font-size="11.5" fill="#8a8070">корпус ASA (тёплый плениум)</text>

  <!-- perimeter coil: rounded rectangle inside -->
  <rect x="240" y="180" width="280" height="240" rx="70" fill="none" stroke="#e2542f" stroke-width="9" opacity="0.9"/>
  <rect x="255" y="195" width="250" height="210" rx="60" fill="none" stroke="#ff9d5c" stroke-width="9" opacity="0.9"/>
  <rect x="270" y="210" width="220" height="180" rx="50" fill="none" stroke="#ee6e3a" stroke-width="9" opacity="0.9"/>
  <rect x="230" y="170" width="300" height="260" rx="80" fill="none" stroke="#b98a4e" stroke-width="3" stroke-dasharray="7 5" opacity="0.5"/>

  <!-- center: funnel to sensors -->
  <rect x="330" y="255" width="100" height="70" rx="10" fill="#dbe7f3" stroke="#7a9cbb"/>
  <text x="380" y="285" text-anchor="middle" font-size="11.5" fill="#2c5a8a" font-weight="bold">камера PM</text>
  <text x="380" y="303" text-anchor="middle" font-size="10.5" fill="#555">выходы → сенсоры</text>
  <text x="380" y="318" text-anchor="middle" font-size="10.5" fill="#777">выход &lt; 10 см от нагретой зоны</text>

  <!-- head + inlet -->
  <rect x="60" y="90" width="130" height="30" rx="8" fill="#eef4fb" stroke="#9db8d4"/>
  <text x="125" y="110" text-anchor="middle" font-size="11.5" fill="#2c5a8a" font-weight="bold">Голова + screen</text>
  <path d="M125,120 C 125,200 190,330 236,330" fill="none" stroke="#999" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M125,150 v40" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="96" y="420" width="130" height="26" rx="6" fill="#dbe7f3" stroke="#7a9cbb"/>
  <text x="161" y="438" text-anchor="middle" font-size="10.5" fill="#2c5a8a">Дренаж в нижней точке петли</text>

  <!-- pros/cons -->
  <text x="240" y="480" font-size="11.5" fill="#2f7a31">+ кратчайший путь к сенсорам (потери T минимальны)</text>
  <text x="240" y="498" font-size="11.5" fill="#8a6d1f">− монтаж вокруг другого узла: сенсоры не сменить отдельно;</text>
  <text x="240" y="516" font-size="11.5" fill="#8a6d1f">− нить по замкнутым виткам вокруг камеры — перегрев локальный;</text>
  <text x="240" y="534" font-size="11.5" fill="#8a6d1f">− ремонт/тест требует разборки всей связки.</text>
</svg>
