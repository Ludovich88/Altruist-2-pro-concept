<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="760" height="560" fill="#fbfaf7"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">V2 — вертикальный змеевик (рекомендован)</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#777">спираль Ø 9 см, 2.5 витка ≈ 40 см трубы · drip leg в нижней точке</text>

  <!-- head -->
  <rect x="40" y="80" width="150" height="34" rx="10" fill="#eef4fb" stroke="#9db8d4"/>
  <text x="115" y="102" text-anchor="middle" font-size="12" fill="#2c5a8a" font-weight="bold">Голова + screen</text>

  <!-- inlet arrow down to drip leg -->
  <line x1="115" y1="114" x2="115" y2="470" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="122" y="300" font-size="11" fill="#555">уклон непрерывный вниз</text>

  <!-- drip leg -->
  <rect x="60" y="472" width="120" height="28" rx="6" fill="#dbe7f3" stroke="#7a9cbb"/>
  <text x="120" y="491" text-anchor="middle" font-size="11" fill="#2c5a8a">Drip leg (дренаж)</text>

  <!-- coil: 3 ellipses stacked, hot filled -->
  <ellipse cx="470" cy="420" rx="130" ry="44" fill="none" stroke="#ff9d5c" stroke-width="9" opacity="0.9"/>
  <ellipse cx="470" cy="330" rx="130" ry="44" fill="none" stroke="#ee6e3a" stroke-width="9" opacity="0.95"/>
  <ellipse cx="470" cy="240" rx="130" ry="44" fill="none" stroke="#e2542f" stroke-width="9" opacity="0.95"/>
  <ellipse cx="470" cy="150" rx="130" ry="44" fill="none" stroke="#e2542f" stroke-width="9"/>
  <!-- insulation outer -->
  <ellipse cx="470" cy="285" rx="152" ry="140" fill="none" stroke="#b98a4e" stroke-width="4" stroke-dasharray="7 5" opacity="0.5"/>
  <text x="470" y="288" text-anchor="middle" font-size="12" fill="#a33a18" font-weight="bold">Нагрев: PTC-нить по виткам</text>
  <text x="470" y="306" text-anchor="middle" font-size="11" fill="#a33a18">изоляция поверх спирали</text>

  <!-- from drip leg up to coil bottom -->
  <path d="M180,486 C 280,486 300,452 340,438" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- up through coil center -->
  <line x1="470" y1="430" x2="470" y2="190" stroke="#888" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="484" y="200" font-size="10.5" fill="#888">поток вверх по виткам</text>

  <!-- output -->
  <line x1="600" y1="150" x2="660" y2="150" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="136" font-size="11" fill="#444">≈40 °C</text>
  <rect x="600" y="120" width="16" height="60" rx="6" fill="#dbe7f3" stroke="#7a9cbb"/>
  <text x="592" y="205" font-size="11" fill="#2c5a8a">холодная зона</text>
  <text x="592" y="219" font-size="11" fill="#2c5a8a">5–8 см</text>

  <!-- sensors -->
  <rect x="560" y="86" width="190" height="30" rx="7" fill="#fff" stroke="#3f7fbf" stroke-width="1.6"/>
  <text x="655" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c5a8a">Сенсоры A + B (вверху)</text>

  <!-- condensate arrows -->
  <text x="60" y="530" font-size="11.5" fill="#8a6d1f">Конденсат стекает по виткам вниз → drip leg → испаряется / дренируется.</text>
  <text x="60" y="548" font-size="11.5" fill="#8a6d1f">Dean vortices в спирали перемешивают ламинарный поток → лучший теплообмен.</text>
</svg>
